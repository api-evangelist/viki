name: Viki
description: >-
  Viki (Rakuten Viki) is a global video streaming service specializing in Korean
  dramas, Chinese dramas, and other Asian television shows and movies, subtitled
  into more than 200 languages by a community of volunteer contributors (the name
  is a portmanteau of "video" and "wiki"). Founded as a startup backed by 500
  Global, Andreessen Horowitz (a16z), and CRV, Viki was acquired by Rakuten in
  2013 and now operates as part of Rakuten's media portfolio. The consumer product
  streams licensed content on web, mobile, and connected-TV apps, funded by
  advertising and a Viki Pass subscription. Viki does not publish a public
  developer API or developer portal; it exposes an internal application API
  (api.viki.io) that powers its own clients and requires app credentials, and a
  community contribution platform for volunteer subtitlers and segmenters. This
  profile was surfaced as a venture-portfolio lead and enriched with the honest
  finding that there is no public API surface to catalog.
